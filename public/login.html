<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aurex</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <a href="index.html" style="position: absolute; top: 16px; right: 16px; font-size: 1.5rem; color: var(--text-light);">
            <i class="fas fa-times"></i>
        </a>

        <div class="auth-header">
            <a href="index.html" class="logo" style="display: flex; align-items: center; justify-content: center; text-decoration: none; gap: 8px;">
                <img src="assets/aurex_bank_logo.png" alt="Aurex Logo" class="custom-logo-img" style="height: 48px;">
                <span class="brand-text" style="font-size: 1.8rem;">Aurex</span>
            </a>


            <h2>Secure Login</h2>
            <p style="color:var(--text-light); margin-top:8px;">
                Access your digital banking dashboard.
            </p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleFinalLogin(event)">
            <!-- Status Banner for accountant approval notifications -->
            <div id="loginStatusBanner" style="display:none;"></div>
            <div id="loginError" class="error-message"></div>
            <div id="loginSuccess" class="success-message"></div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label class="form-label" style="text-align: center; display: block; margin-bottom: 20px;">Enter 6-Digit MPIN</label>
                
                <div class="mpin-wrapper">
                    <div class="mpin-display" id="mpinDisplay">
                        <div class="mpin-dot"></div>
                        <div class="mpin-dot"></div>
                        <div class="mpin-dot"></div>
                        <div class="mpin-dot"></div>
                        <div class="mpin-dot"></div>
                        <div class="mpin-dot"></div>
                    </div>

                    <input type="hidden" id="loginMpin" required>

                    <div class="numeric-keypad" id="numericKeypad">
                        <!-- Keyboard will be generated here by JS -->
                    </div>
                </div>

                <div style="text-align: center; margin-top: 15px;">
                    <a href="forgot-password.html" style="font-size: 0.85rem; color: var(--primary); font-weight: 500;">
                        Forgot MPIN?
                    </a>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                Login
            </button>


        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a><br><br>
            <a href="admin_landing.html">Admin Login</a>
        </div>

    </div>
</div>

<script src="js/auth.js"></script>
<script>
    // Show status banner if redirected from registration
    (function() {
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        if (!status) return;

        const msgs = {
            pending:  "Your account request is under accountant review. Please wait for approval.",
            rejected: "Your account request was rejected by the accountant. Please contact the bank for more details.",
            approved: "Your account has been successfully approved by the accountant. You can now access all banking services."
        };

        const banner = document.getElementById('loginStatusBanner');
        if (banner && msgs[status]) {
            // showStatusBanner is defined in auth.js loaded above
            showStatusBanner(banner, status, msgs[status]);
            // Clean URL without reload
            window.history.replaceState({}, document.title, '/login.html');
        }
    })();
</script>

</body>
</html>
